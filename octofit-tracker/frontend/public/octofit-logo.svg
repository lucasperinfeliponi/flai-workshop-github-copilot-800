<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Octopus Body -->
  <circle cx="100" cy="80" r="45" fill="#818CF8" stroke="#4F46E5" stroke-width="3"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="75" r="8" fill="#1E293B"/>
  <circle cx="115" cy="75" r="8" fill="#1E293B"/>
  <circle cx="87" cy="73" r="3" fill="white"/>
  <circle cx="117" cy="73" r="3" fill="white"/>
  
  <!-- Smile -->
  <path d="M 85 90 Q 100 100 115 90" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Fitness Headband -->
  <ellipse cx="100" cy="55" rx="47" ry="12" fill="#4F46E5"/>
  <text x="100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">FIT</text>
  
  <!-- Left weight tentacle -->
  <path d="M 65 100 Q 40 120 35 145" stroke="#0D9488" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="35" cy="150" r="12" fill="#0D9488" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Right weight tentacle -->
  <path d="M 135 100 Q 160 120 165 145" stroke="#0D9488" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="165" cy="150" r="12" fill="#0D9488" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Bottom tentacles -->
  <path d="M 75 110 Q 60 140 55 170" stroke="#4F46E5" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 90 115 Q 85 145 80 175" stroke="#4F46E5" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 110 115 Q 115 145 120 175" stroke="#4F46E5" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 125 110 Q 140 140 145 170" stroke="#4F46E5" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Trophy/Medal on chest -->
  <circle cx="100" cy="95" r="8" fill="#F97316" stroke="#1E293B" stroke-width="1.5"/>
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">★</text>
</svg>
